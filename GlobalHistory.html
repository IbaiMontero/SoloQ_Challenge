<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global History</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090e15;
      --card-bg: #11161d;
      --card-hover: #1a212b;
      --border: #262e3b;
      --text-main: #e2e8f0;
      --text-dim: #64748b;
      
      /* Colores Lógicos */
      --win-color: #0AC8B9;  /* Cyan/Verde Hextech */
      --loss-color: #E74C3C; /* Rojo Intenso */
      --gold: #F1C40F;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      margin: 0; padding: 0;
      scrollbar-width: thin;
      scrollbar-color: #333 var(--bg);
    }

    /* HEADER */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(9, 14, 21, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 15px 25px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    
    .header h2 {
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
      font-size: 1.6rem; letter-spacing: 1px; margin: 0;
      background: linear-gradient(90deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }

    /* MATCH CARD */
    .match-card {
      display: grid;
      grid-template-columns: 70px 60px 150px 100px 1fr 90px;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 10px;
      padding: 12px 15px;
      transition: transform 0.2s, background 0.2s;
      position: relative;
      overflow: hidden;
    }

    .match-card:hover { transform: translateX(4px); background: var(--card-hover); border-color: #444; }

    /* --- BORDE LATERAL (SOLO INDICA RESULTADO) --- */
    .status-bar {
      position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    }
    .match-win .status-bar { background: var(--win-color); box-shadow: 0 0 10px var(--win-color); }
    .match-loss .status-bar { background: var(--loss-color); }

    /* COLUMNS */
    .col-time { font-family: 'Rajdhani'; font-size: 0.85rem; color: var(--text-dim); text-align: center; line-height: 1.3; }
    
    .col-icon img {
      width: 42px; height: 42px; border-radius: 6px; border: 2px solid #333; object-fit: cover;
    }
    /* El borde de la imagen sigue el resultado de la partida */
    .match-win .col-icon img { border-color: var(--win-color); }
    .match-loss .col-icon img { border-color: var(--loss-color); }

    .col-player { display: flex; flex-direction: column; padding-left: 10px; }
    .player-name { font-weight: 700; color: #fff; font-size: 0.95rem; }
    .player-lane { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }

    .col-kda { font-family: 'Rajdhani'; font-size: 1.2rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    .result-label { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; display: block; margin-top: -2px; }
    
    .match-win .result-label { color: var(--win-color); }
    .match-loss .result-label { color: var(--loss-color); }

    /* ETIQUETAS */
    .col-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      font-size: 0.7rem; padding: 2px 6px; border-radius: 3px;
      background: rgba(255,255,255,0.05); color: #94a3b8; border: 1px solid rgba(255,255,255,0.05);
      white-space: nowrap;
    }
    /* Estilos especiales para etiquetas */
    .tag.highlight { border-color: rgba(241, 196, 15, 0.3); color: var(--gold); background: rgba(241, 196, 15, 0.05); }
    .tag.bad { border-color: rgba(231, 76, 60, 0.3); color: var(--loss-color); background: rgba(231, 76, 60, 0.05); }

    /* --- PUNTOS (INDEPENDIENTE DEL RESULTADO) --- */
    .col-points { text-align: right; font-family: 'Rajdhani'; font-size: 1.5rem; font-weight: 800; }
    
    /* Si suma puntos (VERDE) */
    .pts-positive { 
        color: var(--win-color); 
        text-shadow: 0 0 15px rgba(10, 200, 185, 0.15); 
    }
    
    /* Si resta puntos (ROJO) */
    .pts-negative { 
        color: var(--loss-color); 
    }

    /* LOADER & ERROR */
    #loader { margin-top: 60px; text-align: center; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--win-color); border-radius: 50%; animation: spin 0.8s infinite linear; margin: 0 auto 15px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    #error-box { color: var(--loss-color); text-align: center; margin-top: 30px; display: none; padding: 20px; border: 1px solid var(--loss-color); border-radius: 8px; background: rgba(231, 76, 60, 0.1); }
  </style>
</head>
<body>

  <div class="header">
    <h2>Historial de Partidas</h2>
    <div style="font-size: 0.8rem; color: #666; font-family:'Rajdhani'; font-weight:bold;">LIVE FEED</div>
  </div>

  <div class="container">
    <div id="loader">
      <div class="spinner"></div>
      <div style="color: #64748b; font-size: 0.8rem; letter-spacing: 1px; font-family:'Rajdhani'">SINCRONIZANDO MATCHES...</div>
    </div>

    <div id="error-box"></div>
    <div id="history-list"></div>
  </div>

  <script>
    window.onload = function() {
      google.script.run
        .withSuccessHandler(renderHistory)
        .withFailureHandler(showError)
        .getGlobalHistoryData();
    };

    function renderHistory(data) {
      const loader = document.getElementById('loader');
      const list = document.getElementById('history-list');
      loader.style.display = 'none';

      if (!data || data.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:#666; margin-top:40px;">No hay partidas registradas.</div>';
        return;
      }

      let html = '';
      
      for (var i = 0; i < data.length; i++) {
        var match = data[i];
        
        // 1. Determinar Resultado de la Partida (Borde Lateral)
        var isWin = match.result === 'Win' || match.result === 'Victory';
        var cardClass = isWin ? 'match-win' : 'match-loss';
        var resLabel = isWin ? 'VICTORIA' : 'DERROTA';
        
        // 2. Determinar Color de Puntos (Texto de la derecha)
        var ptsVal = parseFloat(match.points);
        // Si es mayor o igual a 0, Verde. Si es negativo, Rojo.
        var ptsClass = ptsVal >= 0 ? 'pts-positive' : 'pts-negative';
        var sign = ptsVal > 0 ? '+' : '';

        var tagsHtml = createTags(match.notes);
        var champImg = getChampUrl(match.champion);

        html += 
          '<div class="match-card ' + cardClass + '">' +
            '<div class="status-bar"></div>' +
            
            '<div class="col-time">' +
              '<div>' + match.date.split(' ')[0] + '</div>' +
              '<div style="font-size:0.75rem; color:#555">' + match.date.split(' ')[1] + '</div>' +
              '<div style="color:#444; margin-top:2px">' + match.duration + 'm</div>' +
            '</div>' +

            '<div class="col-icon">' +
              '<img src="' + champImg + '" onerror="this.src=\'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/29.jpg\'">' +
            '</div>' +

            '<div class="col-player">' +
              '<div class="player-name">' + match.summoner + '</div>' +
              '<div class="player-lane">' + (match.lane || 'Grieta') + '</div>' +
            '</div>' +

            '<div class="col-kda">' +
              '<div>' + match.kda + '</div>' +
              '<span class="result-label">' + resLabel + '</span>' +
            '</div>' +

            '<div class="col-tags">' + tagsHtml + '</div>' +

            // Aqui aplicamos la clase calculada independientemente del resultado
            '<div class="col-points ' + ptsClass + '">' + sign + match.points + '</div>' +
          '</div>';
      }

      list.innerHTML = html;
    }

    function createTags(notesStr) {
      if (!notesStr) return '';
      var notes = notesStr.split(';');
      var html = '';
      
      for (var j = 0; j < notes.length; j++) {
        var n = notes[j].trim();
        if (n) {
          var cls = 'tag';
          if (n.indexOf('Penta') > -1 || n.indexOf('MVP') > -1 || n.indexOf('Dios') > -1 || n.indexOf('Perfecta') > -1) cls += ' highlight';
          if (n.indexOf('Feeder') > -1 || n.indexOf('AFK') > -1 || n.indexOf('Bancarrota') > -1) cls += ' bad';
          
          html += '<span class="' + cls + '">' + n + '</span>';
        }
      }
      return html;
    }

    function getChampUrl(name) {
      if (!name) return "https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/29.jpg";
      var clean = name.replace(/[^a-zA-Z0-9]/g, '');
      if (clean === 'Wukong') clean = 'MonkeyKing';
      if (clean === 'RenataGlasc') clean = 'Renata';
      return 'https://ddragon.leagueoflegends.com/cdn/14.1.1/img/champion/' + clean + '.png';
    }

    function showError(e) {
      document.getElementById('loader').style.display = 'none';
      var box = document.getElementById('error-box');
      box.style.display = 'block';
      box.innerHTML = '<strong> ERROR:</strong><br>' + e.message;
    }
  </script>

</body>
</html>
