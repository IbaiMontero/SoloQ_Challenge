<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wargods Ranking</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #05080a;
            --card-bg: rgba(20, 25, 35, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            
            /* Colores de Ligas */
            --challenger: #F4C874; 
            --grandmaster: #CD4545; 
            --master: #9D48E0; 
            --diamond: #576BCE; 
            --emerald: #26A865; 
            --platinum: #4E9996; 
            --gold: #FFD700; 
            --silver: #8D99A4; 
            --bronze: #8C513A; 
            --iron: #574D4F; 
        }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 0%, #1a202c 0%, var(--bg-deep) 60%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0; padding: 40px 20px;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- HEADER --- */
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem; margin: 0;
            background: linear-gradient(to bottom, #fff, #999);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));
        }
        .header .subtitle { color: #0AC8B9; font-size: 1rem; letter-spacing: 6px; text-transform: uppercase; margin-top: 10px; font-weight: 700; opacity: 0.8; }

        /* --- TABS (PESTAÑAS DIVISIÓN) --- */
        .div-tabs {
            display: flex; gap: 15px; margin-bottom: 40px; justify-content: center;
        }
        .div-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #888;
            padding: 12px 30px;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            border-radius: 4px;
        }
        .div-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .div-btn.active {
            background: linear-gradient(45deg, #c8aa6e, #9e824c);
            color: #000;
            border-color: #c8aa6e;
            box-shadow: 0 0 15px rgba(200, 170, 110, 0.3);
        }

        /* --- PODIUM --- */
        .podium-container { display: flex; align-items: flex-end; justify-content: center; gap: 20px; margin-bottom: 60px; flex-wrap: wrap; }
        
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px; width: 240px;
            text-align: center; position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); }
        .rank-1 { order: 2; height: 390px; border: 2px solid var(--gold); box-shadow: 0 0 40px rgba(255, 215, 0, 0.15); z-index: 10; }
        .rank-2 { order: 1; height: 330px; border-top: 4px solid var(--silver); margin-bottom: -10px; }
        .rank-3 { order: 3; height: 310px; border-top: 4px solid #CD7F32; margin-bottom: -20px; }
        
        .crown { font-size: 3rem; position: absolute; top: -50px; left: 50%; transform: translateX(-50%); animation: float 3s ease-in-out infinite; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.1); margin: 10px auto; object-fit: cover; }
        .rank-1 .avatar { width: 100px; height: 100px; border-color: var(--gold); box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
        
        .p-name { font-family: 'Cinzel'; font-weight: 700; font-size: 1.4rem; color: #fff; margin-bottom: 2px; }
        
        /* ELO STYLES */
        .p-rank { font-size: 0.9rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: auto; display: inline-block; padding: 2px 8px; border-radius: 4px; background: rgba(0,0,0,0.3); }
        .elo-challenger { color: var(--challenger); text-shadow: 0 0 10px rgba(244, 200, 116, 0.5); }
        .elo-grandmaster { color: var(--grandmaster); }
        .elo-master { color: var(--master); }
        .elo-diamond { color: var(--diamond); }
        .elo-emerald { color: var(--emerald); }
        .elo-platinum { color: var(--platinum); }
        .elo-gold { color: var(--gold); }
        .elo-silver { color: var(--silver); }
        .elo-bronze { color: var(--bronze); }
        .elo-iron { color: var(--iron); }
        .elo-unranked { color: #555; }

        .p-score { font-size: 2rem; font-weight: 900; color: #fff; margin-top: 15px; }
        .p-score span { font-size: 0.8rem; color: #0AC8B9; display: block; }
        .rank-1 .p-score span { color: var(--gold); }

        /* --- CUSTOM TAG --- */
        .custom-tag {
            font-family: 'Rajdhani'; font-size: 0.75rem; font-weight: 700;
            background: linear-gradient(45deg, #FF4444, #FF8844);
            color: white; padding: 2px 6px; border-radius: 4px;
            vertical-align: middle; margin-left: 6px; text-transform: uppercase;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .tag-blue { background: linear-gradient(45deg, #0AC8B9, #0088ff); }
        .tag-gold { background: linear-gradient(45deg, #FFD700, #FFA500); color: black; }

        /* --- TABLE --- */
        .table-wrap {
            width: 100%; max-width: 950px;
            background: var(--card-bg);
            border-radius: 16px; border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            opacity: 0; animation: fadeIn 0.8s ease forwards 0.3s;
        }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 18px 25px; background: rgba(255,255,255,0.03); color: #8b949e; font-family: 'Cinzel'; font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 15px 25px; border-bottom: 1px solid rgba(255,255,255,0.03); vertical-align: middle; font-size: 1.1rem; }
        
        .rank-num { font-weight: 900; color: #555; font-size: 1.2rem; }
        .player-flex { display: flex; align-items: center; gap: 15px; font-weight: 700; }
        .mini-av { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #444; }
        
        .wr-container { display: flex; flex-direction: column; gap: 4px; }
        .wr-bar-bg { width: 80px; height: 4px; background: #333; border-radius: 2px; }
        .wr-bar-fill { height: 100%; border-radius: 2px; }
        
        #loader { margin-top: 50px; text-align: center; color: #8b949e; letter-spacing: 2px; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #0AC8B9; border-radius: 50%; animation: spin 0.8s infinite linear; margin: 0 auto 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes float { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -10px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }
        /* --- COLORES DE ZONA (CHAMPIONS / DESCENSO) --- */
        /* Verde claro transparente para Top 8 */
        tr.zone-champions td {
            background: linear-gradient(90deg, rgba(0, 230, 118, 0.15) 0%, rgba(20, 25, 35, 0.85) 100%) !important;
            border-left: 3px solid #00E676;
        }

        /* Rojo claro transparente para los 3 Últimos */
        tr.zone-relegation td {
            background: linear-gradient(90deg, rgba(255, 68, 68, 0.15) 0%, rgba(20, 25, 35, 0.85) 100%) !important;
            border-left: 3px solid #FF4444;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Wargods Arena</h1>
        <div class="subtitle">Season 2026 Ranking</div>
    </div>

    <div class="div-tabs">
        <button id="btn-div1" class="div-btn active" onclick="switchDivision(1)">🏆 División 1</button>
        <button id="btn-div2" class="div-btn" onclick="switchDivision(2)">⚔️ División 2</button>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <div>SINCRONIZANDO LIGAS...</div>
    </div>

    <div id="app" class="hidden">
        <div id="podium" class="podium-container"></div>
        
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Invocador</th>
                        <th>Rango</th>
                        <th style="text-align:right">Puntos</th>
                    </tr>
                </thead>
                <tbody id="ranking-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        // DATOS GLOBALES
        let globalData = { div1: [], div2: [] };

        // 1. INYECTAMOS LA SEASON QUE VIENE DE LA URL O DEL SERVIDOR
        const currentFilter = "<?= typeof seasonFilter !== 'undefined' ? seasonFilter : 'CURRENT' ?>";

        window.onload = function() {
            // 2. LE PASAMOS EL FILTRO AL BACKEND
            google.script.run
                .withSuccessHandler(initDashboard)
                .withFailureHandler(showError)
                .getRankingByDivision(currentFilter);
        };

        function initDashboard(data) {
            const loader = document.getElementById('loader');
            const app = document.getElementById('app');
            
            if (!data) {
                showError({ message: "No data received" });
                return;
            }

            globalData = data; // Guardamos datos recibidos
            
            // Cargar Division 1 por defecto
            switchDivision(1);

            loader.classList.add('hidden');
            app.classList.remove('hidden');
        }

        // CAMBIAR DE PESTANA
        function switchDivision(divNum) {
            // 1. Gestionar botones
            document.getElementById('btn-div1').classList.remove('active');
            document.getElementById('btn-div2').classList.remove('active');
            document.getElementById(`btn-div${divNum}`).classList.add('active');

            // 2. Elegir datos
            const players = (divNum === 1) ? globalData.div1 : globalData.div2;

            // 3. Renderizar
            if(players.length === 0) {
                document.getElementById('podium').innerHTML = `<div style="text-align:center; width:100%; color:#888;">No hay jugadores en esta division.</div>`;
                document.getElementById('ranking-body').innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px;">Sin participantes</td></tr>`;
            } else {
              
                const top3 = players.slice(0, 3);
                const rest = players.slice(3);
                
                renderPodium(top3);
              
                renderTable(rest, 4, players.length);
            }
        }

        function renderPodium(players) {
        const container = document.getElementById('podium');
        const order = [1, 0, 2]; // Orden visual: 2, 1, 3
        let html = '';

        order.forEach(idx => {
            if (players[idx]) {
                const p = players[idx];
                const pos = idx + 1;
                const crown = pos === 1 ? '<div class="crown"></div>' : '';
                const avatar = getAvatar(p.name);
                const eloClass = getEloClass(p.rank);
                const customTag = getCustomTag(p.name);
                
                // Usamos la misma funcion de formato que hicimos para la tabla
                const streakHtml = formatStreak(p.streak); 

                html += `
                    <div class="card rank-${pos}">
                        ${crown}
                        <img src="${avatar}" class="avatar">
                        <div class="p-name">
                            ${p.name}
                            ${customTag}
                        </div>
                        <div class="p-rank ${eloClass}">
                            ${p.rank || 'Unranked'}
                        </div>
                        
                        <div style="margin: 10px 0; width: 100%; padding: 0 10px; box-sizing: border-box;">
                            <div style="display:flex; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px;">
                                <div style="text-align:center;">
                                    <div style="font-size: 0.7rem; color: #888; text-transform: uppercase;">Games</div>
                                    <div style="font-weight: bold; font-size: 1.1rem;">${p.totalGames}</div>
                                </div>
                                <div style="text-align:center;">
                                    <div style="font-size: 0.7rem; color: #888; text-transform: uppercase;">Racha</div>
                                    <div style="font-size: 1.1rem;">${streakHtml}</div>
                                </div>
                            </div>
                        </div>

                        <div style="margin-top:auto"></div>
                        <div class="p-score">${p.points}<span>PTS</span></div>
                    </div>
                `;
            }
        });
        container.innerHTML = html;
    }
        function renderTable(players, startRank, totalPlayers) {
            const tbody = document.getElementById('ranking-body');
            // Actualizamos la cabecera dinamicamente o asegurate de cambiarla en el HTML fijo
            const thead = document.querySelector('.table-wrap table thead tr');
            if(thead) {
                thead.innerHTML = `
                    <th>#</th>
                    <th>Invocador</th>
                    <th>Rango</th>
                    <th style="text-align:center">Games</th>
                    <th style="text-align:center">Racha</th>
                    <th style="text-align:right">Puntos</th>
                `;
            }

            let html = '';

            players.forEach((p, index) => {
                const rank = startRank + index;
                const avatar = getAvatar(p.name);
                const eloClass = getEloClass(p.rank);
                const customTag = getCustomTag(p.name);
                const opggLink = p.opgg ? `<a href="${p.opgg}" target="_blank" style="color:inherit;text-decoration:none"></a>` : '';

                // Logica de colores de zona (Champions/Descenso)
                let rowClass = '';
                if (rank > (totalPlayers - 3)) rowClass = 'zone-relegation';
                else if (rank <= 8) rowClass = 'zone-champions';

                // Formatear Racha
                const streakDisplay = formatStreak(p.streak);

                html += `
                    <tr class="${rowClass}">
                        <td class="rank-num">${rank}</td>
                        <td>
                            <div class="player-flex">
                                <img src="${avatar}" class="mini-av">
                                <div>
                                    ${p.name} ${opggLink}
                                    ${customTag}
                                </div>
                            </div>
                        </td>
                        <td class="${eloClass}" style="font-weight:bold; font-size:0.9em;">${p.rank || 'Unranked'}</td>
                        
                        <td style="text-align:center; font-weight:bold; color:#ccc;">${p.totalGames}</td>
                        
                        <td style="text-align:center;">${streakDisplay}</td>
                        
                        <td style="text-align:right; font-weight:900; color:#0AC8B9; font-size:1.2rem">${p.points}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // --- ANADE ESTA FUNCION NUEVA AL FINAL DEL SCRIPT ---
        function formatStreak(val) {
            const s = parseInt(val) || 0;
            if (s >= 3) return `<span style="color:#FF4444; font-weight:bold;"> +${s}</span>`; // On Fire
            if (s >= 1) return `<span style="color:#00E676; font-weight:bold;">+${s}</span>`;   // Ganando
            if (s <= -3) return `<span style="color:#00BFFF; font-weight:bold;"> ${s}</span>`; // Congelado
            if (s <= -1) return `<span style="color:#888;">${s}</span>`;                         // Perdiendo
            return `<span style="color:#444;">-</span>`;
        }

        // --- FUNCIONES AUXILIARES (IGUAL QUE ANTES) ---
        function getEloClass(rankString) {
            if (!rankString) return 'elo-unranked';
            const r = String(rankString).toLowerCase();
            if (r.includes('challenger')) return 'elo-challenger';
            if (r.includes('grandmaster')) return 'elo-grandmaster';
            if (r.includes('master')) return 'elo-master';
            if (r.includes('diamond')) return 'elo-diamond';
            if (r.includes('emerald')) return 'elo-emerald';
            if (r.includes('platinum')) return 'elo-platinum';
            if (r.includes('gold')) return 'elo-gold';
            if (r.includes('silver')) return 'elo-silver';
            if (r.includes('bronze')) return 'elo-bronze';
            if (r.includes('iron')) return 'elo-iron';
            return 'elo-unranked';
        }

        function getCustomTag(playerName) {
            const name = String(playerName).toLowerCase().trim();
            const tags = {
                'elzorro1': { text: 'MAKE IT RAIN', style: '' },
                'zakil potolo': { text: 'GREEN MOCO', style: 'tag-blue' },
                'elsamuel': { text: 'El ESPANTAPAJAROS', style: '' },
                'atomic': { text: 'G.LAMBON', style: '' },
                'mel petarda': { text: 'META SLAVE', style: '' },
                'let me eyp': { text: 'DELETED ACCOUNT', style: 'tag-blue' },
                'cabrrnn': { text: 'KICK-O', style: '' },
                'mrezok': { text: 'HATER DE PINKS', style: '' },
                'pitilin moreno': { text: 'TERABOX', style: 'tag-blue' },
                'sen': { text: 'MULTITALENTED', style: 'tag-gold' },
                'magaashryver': { text: 'BLOODTHIRSTY', style: '' },
                'xfera': { text: 'BAUS SPECIAL', style: '' },
                'aaron parke': { text: '1v9 MACHINE', style: 'tag-blue' },
                'thelastone011': { text: 'THE RAT', style: '' },
                'diecisiete': { text: 'MARKSMAN', style: 'tag-blue' },
                'chromosome z': { text: 'UNDERAGE LOVER', style: 'tag-gold' },
                'chromosome w': { text: 'UNKILLABLE', style: '' },
                'bluedraki': { text: 'FILL KING', style: 'tag-gold' },
                'hm': { text: 'NAVE', style: 'tag-blue' },
                'ry zacker': { text: 'FREESTYLE', style: 'tag-gold' },
                '3uskwarrior': { text: 'SUPPORT ENJOYER', style: '' },
                'akallabeth': { text: 'SOLO LANER', style: '' }
            };

            if (tags[name]) {
                return `<span class="custom-tag ${tags[name].style}">${tags[name].text}</span>`;
            }
            return '';
        }

        function getAvatar(name) {
            let hash = 0;
            if(!name) return "https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/29.jpg";
            const n = String(name);
            for (let i = 0; i < n.length; i++) hash = n.charCodeAt(i) + ((hash << 5) - hash);
            const ids = [4568, 3587, 4001, 7, 29, 588, 4406, 23];
            return `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/${ids[Math.abs(hash) % ids.length]}.jpg`;
        }

        function showError(e) {
            document.getElementById('loader').innerHTML = `<div style="color:#FF4444; font-weight:bold">ERROR: ${e.message}</div>`;
        }
    </script>
</body>
</html>
